# ─── DEEP SPACE THEME ─────────────────────

background #1b182c
foreground #cbcdd2
cursor #cbcdd2

selection_background #2e2c40
selection_foreground #cbcdd2

active_border_color #906cff
inactive_border_color #706e86

# Normal colors
color0  #1b182c
color1  #ff5458
color2  #62d196
color3  #ffb378
color4  #65b2ff
color5  #906cff
color6  #63f2f1
color7  #cbcdd2

# Bright colors
color8  #706e86
color9  #ff8080
color10 #95ffa4
color11 #ffe9aa
color12 #91ddff
color13 #c991e1
color14 #aaffe4
color15 #e3e6ee

# ─── FONTS ────────────────────────────────

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

font_size 12.5
text_composition_strategy platform

# ─── WINDOW ───────────────────────────────

window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0

background_opacity 0.90
dynamic_background_opacity yes
background_blur 20

# ─── CURSOR ───────────────────────────────

cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5

cursor_trail 1
cursor_trail_decay 0.1 0.4

# ─── TABS ─────────────────────────────────

tab_bar_style hidden
map ctrl+shift+t no_op

# ─── SPLITS ───────────────────────────────

enabled_layouts splits,stack

map ctrl+shift+d launch --location=vsplit --cwd=current
map ctrl+shift+s launch --location=hsplit --cwd=current

map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# ─── INTEGRATION ──────────────────────────

shell_integration enabled
term xterm-kitty

# ─── REMOTE CONTROL ───────────────────────

allow_remote_control no

